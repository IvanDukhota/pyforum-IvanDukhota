postgres_packages:
  - postgresql
  - python3-psycopg2
  - acl

postgres_version: 16
postgres_port: 5432
postgres_listen_addresses: "localhost, {{ ansible_host }}"

postgres_db_name: forum
postgres_db_user: pyforum
postgres_db_password: "{{ vault_postgres_db_password }}"

postgres_dump_src: "{{ playbook_dir }}/../../forum_d.sql"
postgres_dump_dest: /var/lib/postgresql/forum_d.sql

postgres_backup_dir: /var/backups/postgresql
postgres_backup_keep_days: 7
postgres_backup_schedule: "*-*-* 12:00:00"
