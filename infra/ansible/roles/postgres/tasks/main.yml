- name: Install PostgreSQL packages
  ansible.builtin.apt:
    name: "{{ postgres_packages }}"
    state: present

- name: Configure PostgreSQL listen address and port
  ansible.builtin.template:
    src: pyforum.conf.j2
    dest: "/etc/postgresql/{{ postgres_version }}/main/conf.d/pyforum.conf"
    owner: postgres
    group: postgres
    mode: "0644"
  notify: Restart postgresql

- name: Allow app servers to connect with password
  community.postgresql.postgresql_pg_hba:
    dest: "/etc/postgresql/{{ postgres_version }}/main/pg_hba.conf"
    contype: host
    databases: "{{ postgres_db_name }}"
    users: "{{ postgres_db_user }}"
    source: "{{ hostvars[item].ansible_host }}/32"
    method: scram-sha-256
  loop: "{{ groups['app_servers'] }}"
  notify: Reload postgresql

- name: Allow PostgreSQL port from app servers
  community.general.ufw:
    rule: allow
    port: "{{ postgres_port }}"
    proto: tcp
    src: "{{ hostvars[item].ansible_host }}"
  loop: "{{ groups['app_servers'] }}"

- name: Ensure PostgreSQL is running and enabled
  ansible.builtin.service:
    name: postgresql
    state: started
    enabled: true

- name: Create application database user
  community.postgresql.postgresql_user:
    name: "{{ postgres_db_user }}"
    password: "{{ postgres_db_password }}"
  become_user: postgres
  no_log: true

- name: Create application database
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    owner: "{{ postgres_db_user }}"
  become_user: postgres

- name: Copy database dump without owner statements
  ansible.builtin.copy:
    content: "{{ lookup('file', postgres_dump_src) | regex_replace('(?m)^ALTER .* OWNER TO postgres;\\n', '') }}"
    dest: "{{ postgres_dump_dest }}"
    owner: postgres
    group: postgres
    mode: "0600"

- name: Check if database is already loaded
  community.postgresql.postgresql_query:
    login_db: "{{ postgres_db_name }}"
    query: "SELECT to_regclass('public.django_migrations') IS NOT NULL AS loaded"
  become_user: postgres
  register: postgres_db_state

- name: Load database dump
  community.postgresql.postgresql_db:
    name: "{{ postgres_db_name }}"
    state: restore
    target: "{{ postgres_dump_dest }}"
    login_host: 127.0.0.1
    login_user: "{{ postgres_db_user }}"
    login_password: "{{ postgres_db_password }}"
  when: not postgres_db_state.query_result[0].loaded

- name: Create backup directory
  ansible.builtin.file:
    path: "{{ postgres_backup_dir }}"
    state: directory
    owner: postgres
    group: postgres
    mode: "0700"

- name: Install backup script
  ansible.builtin.template:
    src: pyforum-db-backup.sh.j2
    dest: /usr/local/bin/pyforum-db-backup.sh
    mode: "0755"

- name: Install backup systemd units
  ansible.builtin.template:
    src: "{{ item }}.j2"
    dest: "/etc/systemd/system/{{ item }}"
    mode: "0644"
  loop:
    - pyforum-db-backup.service
    - pyforum-db-backup.timer

- name: Enable backup timer
  ansible.builtin.systemd_service:
    name: pyforum-db-backup.timer
    state: started
    enabled: true
    daemon_reload: true
