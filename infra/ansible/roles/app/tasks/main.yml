- name: Install Docker SDK for Python
  ansible.builtin.apt:
    name: python3-docker
    state: present

- name: Create app directory
  ansible.builtin.file:
    path: "{{ app_home }}"
    state: directory
    mode: "0750"

- name: Create application env file
  ansible.builtin.template:
    src: env.j2
    dest: "{{ app_env_file }}"
    mode: "0600"
  no_log: true
  register: app_env

- name: Run pyforum container
  community.docker.docker_container:
    name: pyforum
    image: "{{ app_image }}:{{ app_image_tag }}"
    pull: missing
    network_mode: host
    env_file: "{{ app_env_file }}"
    restart_policy: unless-stopped
    recreate: "{{ app_env is changed }}"

- name: Allow app port from load balancer
  community.general.ufw:
    rule: allow
    port: "{{ app_port }}"
    proto: tcp
    src: "{{ app_lb_host }}"

- name: Wait for pyforum to respond
  ansible.builtin.uri:
    url: "http://{{ ansible_host }}:{{ app_port }}/"
    status_code: 200
  register: app_health
  until: app_health.status == 200
  retries: 10
  delay: 3
