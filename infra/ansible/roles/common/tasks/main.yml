- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600

- name: Install base packages
  ansible.builtin.apt:
    name: "{{ common_packages }}"
    state: present

- name: Allow SSH from host
  community.general.ufw:
    rule: allow
    port: "22"
    proto: tcp
    src: "{{ common_ssh_allowed_from }}"

- name: Enable firewall and decline incoming by default
  community.general.ufw:
    state: enabled
    policy: deny
