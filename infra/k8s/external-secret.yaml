apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: pyforum-secret
  namespace: pyforum
spec:
  refreshInterval: 1h
  secretStoreRef:
    kind: ClusterSecretStore
    name: aws-secrets-manager
  target:
    name: pyforum-secret
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: pyforum/app
